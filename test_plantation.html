<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriScan — Test conseil de plantation</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:system-ui,sans-serif;background:#f5f3ee;color:#161512;padding:24px;max-width:820px;margin:auto;}
  h1{color:#0f6e56;font-size:20px;margin-bottom:4px;}
  p.sous{color:#888;font-size:13px;margin-bottom:20px;}
  fieldset{border:1px solid #ccc;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
  legend{font-weight:700;color:#0f6e56;padding:0 6px;}
  label{font-size:13px;font-weight:600;color:#555;}
  input{padding:8px;border:1px solid #ccc;border-radius:8px;font-size:13px;}
  input[type=number]{width:110px;}
  .ligne{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .btn{background:#0f6e56;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;}
  .btn:disabled{opacity:.5;cursor:wait;}
  .entete{background:#eaf5f1;border:1px solid #cfe7de;color:#0a4e3d;font-size:13px;padding:10px 12px;border-radius:8px;margin:12px 0;}
  .carte{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px 16px;margin-bottom:10px;border-left:5px solid #ccc;}
  .carte.fav{border-left-color:#3B8C4E;}
  .carte.prec{border-left-color:#D9A441;}
  .carte.dec{border-left-color:#C0492E;}
  .carte .titre{display:flex;justify-content:space-between;align-items:center;}
  .carte .nom{font-size:16px;font-weight:800;text-transform:capitalize;}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;}
  .badge.fav{background:#3B8C4E;} .badge.prec{background:#D9A441;} .badge.dec{background:#C0492E;}
  .raisons{font-size:12.5px;color:#555;margin-top:8px;}
  .raisons li{margin:2px 0;}
  .note{font-size:12px;color:#888;font-style:italic;margin-top:6px;}
  .msg{font-size:13px;margin:8px 0;}
  .msg.err{color:#b23b2e;} .msg.ok{color:#0f6e56;}
  pre{background:#141d1a;color:#c8f2e0;padding:14px;border-radius:10px;font-size:11px;overflow:auto;margin-top:16px;}
</style>
</head>
<body>
  <h1>🌱 AgriScan — Test conseil de plantation</h1>
  <p class="sous">Vérifie les verdicts (température ERA5 + saison + pluie CHIRPS croisés avec la fiche technique).</p>

  <fieldset>
    <legend>Paramètres</legend>
    <div class="ligne">
      <div><label>Ouest</label><br><input id="ouest" type="number" step="0.001" value="-5.945"></div>
      <div><label>Sud</label><br><input id="sud" type="number" step="0.001" value="6.835"></div>
      <div><label>Est</label><br><input id="est" type="number" step="0.001" value="-5.895"></div>
      <div><label>Nord</label><br><input id="nord" type="number" step="0.001" value="6.875"></div>
    </div>
    <div class="ligne">
      <div><label>Date de référence</label><br><input type="date" id="dateRef" value="2024-12-15"></div>
    </div>
    <button class="btn" id="btn" onclick="tester()">Conseiller les cultures</button>
    <p class="sous" style="margin-top:8px;">Astuce : teste une date en saison sèche (déc) puis en saison des pluies (juin) pour voir les verdicts changer.</p>
  </fieldset>

  <div id="msg" class="msg"></div>
  <div id="entete" class="entete" style="display:none;"></div>
  <div id="resultats"></div>

  <h3 style="font-size:14px;color:#555;">Réponse brute (JSON) :</h3>
  <pre id="brut">—</pre>

<script>
  const classeVerdict = v => v==='Favorable'?'fav':(v==='Deconseille'?'dec':'prec');

  async function tester(){
    const btn=document.getElementById('btn'); btn.disabled=true;
    const msg=document.getElementById('msg'); msg.className='msg'; msg.textContent='⏳ Calcul en cours… (ERA5 + CHIRPS, 15-40 s)';
    document.getElementById('resultats').innerHTML='';
    document.getElementById('entete').style.display='none';

    const corps={
      bbox:[parseFloat(ouest.value),parseFloat(sud.value),parseFloat(est.value),parseFloat(nord.value)],
      date_ref:document.getElementById('dateRef').value
    };
    try{
      const rep=await fetch('http://127.0.0.1:5000/plantation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corps)});
      const data=await rep.json();
      document.getElementById('brut').textContent=JSON.stringify(data,null,2);
      if(data.erreur){msg.className='msg err';msg.textContent='❌ '+data.erreur;btn.disabled=false;return;}

      const ent=document.getElementById('entete'); ent.style.display='block';
      ent.textContent='Mois : '+data.mois+' · Température moyenne : '+(data.temperature_moy ?? '?')+'°C · Pluie sur ~90j : '+(data.pluie_cycle_mm ?? '?')+' mm';

      const cont=document.getElementById('resultats');
      data.cultures.forEach(c=>{
        const cl=classeVerdict(c.verdict);
        const div=document.createElement('div'); div.className='carte '+cl;
        div.innerHTML='<div class="titre"><span class="nom">'+c.culture+'</span>'
          +'<span class="badge '+cl+'">'+c.verdict+'</span></div>'
          +'<ul class="raisons">'+c.raisons.map(r=>'<li>'+r+'</li>').join('')+'</ul>'
          +'<div class="note">'+c.note+'</div>';
        cont.appendChild(div);
      });
      msg.className='msg ok'; msg.textContent='✓ Conseil calculé.';
    }catch(e){msg.className='msg err';msg.textContent="❌ Impossible de joindre la passerelle (py passerelle.py).";}
    btn.disabled=false;
  }
</script>
</body>
</html>
